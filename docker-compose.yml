# Production on a server where Caddy is already installed: the app listens on 127.0.0.1:3003
# and the server's Caddy proxies to it (see the Caddyfile in this folder).
services:
  web:
    build: { context: ., target: web }
    restart: unless-stopped
    # Only reachable from the server itself; the Caddy installed on the server proxies to it.
    ports:
      - "127.0.0.1:3003:3000"
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/pocket
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on: [mongo, redis]

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/pocket
      REDIS_URL: redis://redis:6379
    depends_on: [mongo, redis]

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo:/data/db
    # Not published to the internet — only the app containers can reach it.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data

volumes:
  mongo:
  redis:
  uploads:
