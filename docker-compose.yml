services:
  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/pocket
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on: [mongo, redis]

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/pocket
      REDIS_URL: redis://redis:6379
    depends_on: [mongo, redis]

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo:/data/db
    # Not published to the internet — only the app containers can reach it.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  mongo:
  redis:
  uploads:
  caddy_data:
  caddy_config:
